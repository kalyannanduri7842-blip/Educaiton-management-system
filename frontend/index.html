<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduSphere — School Academic & Student Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --border-focus: #059669;
      --text: #111827;
      --text-muted: #6b7280;
      --primary: #059669;
      --primary-hover: #047857;
      --amber: #d97706;
      --amber-light: #fef3c7;
      --green-light: #d1fae5;
      --red: #dc2626;
      --red-light: #fee2e2;
      --radius: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Clean, Standard Navigation */
    .navbar {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      height: 60px;
      display: flex;
      align-items: center;
    }
    .navbar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .brand {
      font-size: 17px;
      font-weight: 700;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand span {
      color: var(--primary);
    }
    .nav-links {
      display: flex;
      gap: 24px;
    }
    .nav-links a {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.15s ease;
    }
    .nav-links a:hover {
      color: var(--text);
    }

    /* Standard Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 13.5px;
      font-weight: 600;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      background: var(--primary);
      color: #ffffff;
    }
    .btn:hover {
      background: var(--primary-hover);
    }
    .btn-outline {
      background: #ffffff;
      border-color: #d1d5db;
      color: #374151;
    }
    .btn-outline:hover {
      background: #f3f4f6;
      border-color: #9ca3af;
      color: #111827;
    }
    .btn-sm {
      padding: 5px 10px;
      font-size: 12.5px;
    }
    .btn-amber {
      background: var(--amber);
      color: #ffffff;
    }
    .btn-amber:hover {
      background: #b45309;
    }
    .btn-danger {
      background: var(--red);
      color: #ffffff;
    }
    .btn-danger:hover {
      background: #b91c1c;
    }

    /* Forms & Inputs */
    .input {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #d1d5db;
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--text);
      outline: none;
    }
    .input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.15);
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }

    /* Clean Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 4px;
    }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-amber { background: #fef3c7; color: #92400e; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-gray { background: #f3f4f6; color: #374151; }

    /* Tables */
    .table-container {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    .data-table th, .data-table td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .data-table th {
      background: #f9fafb;
      font-weight: 600;
      color: #4b5563;
      font-size: 12.5px;
    }
    .data-table tr:last-child td {
      border-bottom: none;
    }
    .data-table tr:hover td {
      background: #f9fafb;
    }

    /* Cards & Grids */
    .card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    .stat-card .label {
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .stat-card .value {
      font-size: 24px;
      font-weight: 700;
      color: #111827;
      margin-top: 4px;
    }

    /* App Workspace Layout */
    .app-layout {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 240px;
      background: #ffffff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-menu {
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }
    .sidebar-menu a {
      padding: 8px 12px;
      font-size: 13.5px;
      font-weight: 500;
      color: #4b5563;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-menu a:hover {
      background: #f3f4f6;
      color: #111827;
    }
    .sidebar-menu a.active {
      background: #ecfdf5;
      color: #065f46;
      font-weight: 600;
    }

    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .topbar {
      height: 56px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .content-area {
      padding: 24px;
      flex: 1;
    }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 13.5px;
      margin-bottom: 16px;
      border: 1px solid transparent;
    }
    .alert-green { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
    .alert-amber { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .alert-red { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
  <script type="text/babel" src="/app.js"></script>
</body>
</html>
